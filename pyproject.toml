[project]
name = "ha-feller-wiser"
version = "0.0.0"
description = "Home Assistant integration for the Wiser by Feller µGateway (local REST + WebSocket)"
readme = "README.md"
requires-python = ">=3.14.2"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component==0.13.365",
    "ruff==0.16.7",
    "mypy==1.20.0",
    "pre-commit",
    "aiohttp",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:sugar --timeout=60"
filterwarnings = [
    "error::DeprecationWarning:custom_components.*",
]

[tool.coverage.run]
source = ["custom_components/feller_wiser"]
branch = true

[tool.coverage.report]
skip_covered = true
show_missing = true

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["config"]

[tool.ruff.lint]
select = [
    "A", "ASYNC", "B", "C4", "D", "E", "F", "I", "ISC", "N", "PGH", "PIE", "PL", "RET",
    "RSE", "RUF", "S", "SIM", "T20", "TID", "UP", "W",
]
ignore = [
    "D203", "D212", "D213", "D404", "D406", "D407", "D413",
    "PLR0913", "PLR0912", "PLR0915", "PLR2004", "PLC0415", "PLR0911",
    "ISC001", "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "D", "PLR", "ARG", "SLF001", "ASYNC109", "B017", "PT011"]
"simulator/**" = ["S101", "S104", "T20", "D", "BLE001"]
"scripts/**" = ["T20", "S", "D", "ASYNC240"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "simulator", "tests"]
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["custom_components.feller_wiser"]
warn_unreachable = false
show_error_codes = true
